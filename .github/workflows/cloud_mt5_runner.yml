name: Titan Cloud Autonomous MT5 Executor (24/7 Serverless)

on:
  schedule:
    # Runs every 30 minutes during Monday-Friday market hours
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud-trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 pandas numpy

      - name: Download and Install Headless MetaTrader 5 Terminal
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $installerUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $installerPath = "$env:TEMP\mt5setup.exe"
          Write-Host "Downloading Official MetaTrader 5 Setup..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UserAgent "Mozilla/5.0"
          Write-Host "Installing MT5 in silent portable mode..."
          Start-Process -FilePath $installerPath -ArgumentList "/auto /portable" -Wait -NoNewWindow
          Write-Host "MT5 Installation Complete."

      - name: Run Titan Cloud MT5 Trader
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python cloud_mt5_executor.py
