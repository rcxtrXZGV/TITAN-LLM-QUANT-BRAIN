name: Titan Cloud Autonomous MT5 Executor (24/7 Serverless)

on:
  schedule:
    # Runs every 30 minutes during Monday-Friday market hours
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud-trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install MetaTrader5 pandas numpy

      - name: Download and Install Headless MetaTrader 5 Terminal
        run: |
          $installerUrl = "https://download.mql5.com/cdn/web/ic.markets.raw/mt5/icmarketssc5setup.exe"
          $installerPath = "$env:TEMP\icmarketssc5setup.exe"
          Write-Host "Downloading IC Markets MT5 Installer..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          Write-Host "Installing MT5 in silent /portable mode..."
          Start-Process -FilePath $installerPath -ArgumentList "/auto /portable" -Wait
          Write-Host "MT5 Installation Complete."

      - name: Run Titan Cloud MT5 Trader
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python cloud_mt5_executor.py
