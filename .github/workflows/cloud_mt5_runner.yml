name: Titan Cloud Autonomous MT5 Executor (24/7 Serverless)

on:
  schedule:
    # Runs automatically every 30 minutes 24/7 completely free
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud-trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install MetaTrader5 requests

      - name: Download & Extract Pre-Configured Headless MT5 Runtime & Config
        shell: powershell
        run: |
          $mt5ZipUrl = "https://api.github.com/repos/rcxtrXZGV/TITAN-LLM-QUANT-BRAIN/releases/assets/718089105"
          $configZipUrl = "https://api.github.com/repos/rcxtrXZGV/TITAN-LLM-QUANT-BRAIN/releases/assets/718127679"
          $targetDir = "C:\MT5"
          $appdataDir = "$env:APPDATA\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075"
          
          $headers = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/octet-stream"
          }
          
          Invoke-WebRequest -Uri $mt5ZipUrl -Headers $headers -OutFile "$env:TEMP\mt5.zip"
          Expand-Archive -Path "$env:TEMP\mt5.zip" -DestinationPath $targetDir -Force
          
          Invoke-WebRequest -Uri $configZipUrl -Headers $headers -OutFile "$env:TEMP\config.zip"
          New-Item -ItemType Directory -Force -Path $appdataDir | Out-Null
          Expand-Archive -Path "$env:TEMP\config.zip" -DestinationPath $appdataDir -Force

          Copy-Item -Path "$appdataDir\*" -Destination $targetDir -Recurse -Force

      - name: Execute Autonomous Trading Cycle
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python cloud_mt5_executor.py
