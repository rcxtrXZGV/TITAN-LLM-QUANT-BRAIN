name: Fire One-Click Cloud Verification Deal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fire-cloud-trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install MetaTrader5

      - name: Download and Install Headless MetaTrader 5 Terminal
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $installerUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $installerPath = "$env:TEMP\mt5setup.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UserAgent "Mozilla/5.0"
          Start-Process -FilePath $installerPath -ArgumentList "/auto /portable" -Wait -NoNewWindow

      - name: Execute Cloud Deal to IC Markets Broker
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python cloud_test_deal.py
