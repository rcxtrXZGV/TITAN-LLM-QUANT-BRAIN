name: Fire One-Click Cloud Verification Deal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fire-cloud-trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install MetaTrader5 requests

      - name: Download & Extract Pre-Configured Headless MT5 Runtime
        shell: powershell
        run: |
          $releaseUrl = "https://github.com/rcxtrXZGV/TITAN-LLM-QUANT-BRAIN/releases/download/v1.0.0/mt5_portable.zip"
          $zipPath = "$env:TEMP\mt5_portable.zip"
          $targetDir = "C:\MT5"
          
          Write-Host "Downloading Pre-configured MT5 Runtime..."
          $headers = @{ "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}" }
          Invoke-WebRequest -Uri $releaseUrl -Headers $headers -OutFile $zipPath
          
          Write-Host "Extracting to $targetDir..."
          Expand-Archive -Path $zipPath -DestinationPath $targetDir -Force
          
          # Register terminal in registry / start headless portable instance
          Write-Host "Checking terminal64.exe..."
          Test-Path "$targetDir\terminal64.exe"

      - name: Execute Cloud Deal to IC Markets Broker
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python cloud_test_deal.py
