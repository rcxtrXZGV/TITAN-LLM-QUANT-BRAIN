name: Fire One-Click Cloud Verification Deal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fire-cloud-trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install MetaTrader5 requests

      - name: Download & Extract Pre-Configured Headless MT5 Runtime
        shell: powershell
        run: |
          $mt5ZipUrl = "https://github.com/rcxtrXZGV/TITAN-LLM-QUANT-BRAIN/releases/download/v1.0.0/mt5_portable.zip"
          $targetDir = "C:\MT5"
          
          Write-Host "Downloading standalone MT5 runtime..."
          Invoke-WebRequest -Uri $mt5ZipUrl -OutFile "$env:TEMP\mt5.zip"
          Expand-Archive -Path "$env:TEMP\mt5.zip" -DestinationPath $targetDir -Force
          Write-Host "Extracted MT5 runtime successfully to $targetDir"

      - name: Execute Cloud Deal to IC Markets Broker
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python cloud_test_deal.py
