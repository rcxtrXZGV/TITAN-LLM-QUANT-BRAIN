name: Audit Broker Balance Live

on:
  workflow_dispatch:

jobs:
  check-balance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MT5
        run: |
          pip install MetaTrader5

      - name: Restore MT5 Cache
        id: cache-mt5
        uses: actions/cache@v4
        with:
          path: |
            C:\MT5
            C:\Users\runneradmin\AppData\Roaming\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075
          key: titan-mt5-runtime-v1

      - name: Fetch Live Balance From Broker
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        shell: powershell
        run: |
          python -c @"
          import os, sys, time, subprocess, tempfile, json
          import MetaTrader5 as mt5

          login = int(os.environ.get('MT5_LOGIN', '0'))
          password = os.environ.get('MT5_PASSWORD', '')
          server = os.environ.get('MT5_SERVER', 'ICMarketsSC-Demo')
          terminal_path = r'C:\MT5	erminal64.exe'

          ini_path = os.path.join(tempfile.gettempdir(), 'mt5_check.ini')
          with open(ini_path, 'w') as f:
              f.write(f'[Common]\nLogin={login}\nPassword={password}\nServer={server}\n')

          subprocess.Popen([terminal_path, f'/config:{ini_path}'])
          time.sleep(40)

          if not (mt5.initialize(path=terminal_path, timeout=60000) or mt5.initialize(timeout=60000)):
              print('FAILED_TO_CONNECT')
              sys.exit(1)

          acc = mt5.account_info()
          pos = mt5.positions_get()
          pos_info = []
          if pos:
              for p in pos:
                  pos_info.append({'ticket': p.ticket, 'symbol': p.symbol, 'volume': p.volume, 'open_price': p.price_open, 'current_price': p.price_current, 'sl': p.sl, 'tp': p.tp, 'profit': p.profit})

          res = {
              'account_name': acc.name,
              'balance': acc.balance,
              'equity': acc.equity,
              'margin': acc.margin,
              'free_margin': acc.margin_free,
              'open_positions': pos_info
          }
          print('###AUDIT_RESULT_START###')
          print(json.dumps(res, indent=2))
          print('###AUDIT_RESULT_END###')
          mt5.shutdown()
          "@
